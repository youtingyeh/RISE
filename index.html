  <!-- Keep a public fallback even if the main scripts fail. -->
  <script>
    window.riseProblems = [];
    window.riseReport = function (message) {
      if (!window.riseProblems.includes(message)) {
        window.riseProblems.push(message);
        console.error('[RISE page load]', message);
      }
      var panel = document.getElementById('load-status');
      if (panel) panel.hidden = false;
    };
    window.addEventListener('error', function (event) {
      if (event.message) window.riseReport(event.message);
    });
    window.addEventListener('DOMContentLoaded', function () {
      if (window.riseProblems.length) document.getElementById('load-status').hidden = false;
    });
    window.addEventListener('load', function () {
      if (!window.RISE_DATA || document.getElementById('fallback-home')) {
        window.riseReport('Public page rendering incomplete');
      }
    });
  </script>
