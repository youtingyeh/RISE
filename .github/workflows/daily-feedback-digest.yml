name: Daily site check and feedback digest
on:
  schedule:
    # UTC 00:30 = Taiwan 08:30 every day.
    - cron: '30 0 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: daily-feedback-digest
  cancel-in-progress: false
jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Read repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check live pages and send digest
        env:
          RISE_SITE_URL: https://youtingyeh.github.io/RISE/
          RISE_SUPABASE_URL: ${{ secrets.RISE_SUPABASE_URL }}
          RISE_SUPABASE_ANON_KEY: ${{ secrets.RISE_SUPABASE_ANON_KEY }}
          RISE_DIGEST_TOKEN: ${{ secrets.RISE_DIGEST_TOKEN }}
        run: node scripts/daily-site-check.mjs
