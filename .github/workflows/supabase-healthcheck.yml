name: Supabase database health check
on:
  schedule:
    # UTC; Taiwan time 09:17, 17:17, and 01:17 each day.
    - cron: '17 1,9,17 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/supabase-healthcheck.yml'
      - 'scripts/supabase-healthcheck.py'
      - 'auth-config.js'
permissions:
  contents: read
concurrency:
  group: supabase-healthcheck
  cancel-in-progress: false
jobs:
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Query public course catalog (read only)
        run: python3 scripts/supabase-healthcheck.py
