name: Feedback autofix scan
# 每天臺北時間 09:00。開關與逐案授權由後端檢查。
on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: feedback-autofix
  cancel-in-progress: false
jobs:
  scan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RISE_SUPABASE_URL: ${{ vars.RISE_SUPABASE_URL || secrets.RISE_SUPABASE_URL }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - name: Check schedule and approved cases
        id: preflight
        run: node tools/autofix/run.mjs preflight
      - if: steps.preflight.outputs.pending == 'true'
        run: npm ci --ignore-scripts
      - if: steps.preflight.outputs.pending == 'true'
        run: npx playwright install --with-deps chromium
      - name: Reproduce, fix and verify approved links
        if: steps.preflight.outputs.pending == 'true'
        id: scan
        env:
          RISE_REPAIR_OUTPUT: ${{ runner.temp }}/rise-repair-patches
          RISE_REPAIR_HANDOFF: ${{ runner.temp }}/rise-repair-deliveries.json
        run: node tools/autofix/run.mjs scan
      - name: Provide verified patches for manual review
        if: steps.scan.outputs.ready == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rise-verified-link-repairs
          path: ${{ runner.temp }}/rise-repair-patches/*.patch
          if-no-files-found: error
          retention-days: 14
      - name: Record delivered patches
        if: steps.scan.outputs.ready == 'true'
        env:
          RISE_REPAIR_HANDOFF: ${{ runner.temp }}/rise-repair-deliveries.json
        run: node tools/autofix/run.mjs record
